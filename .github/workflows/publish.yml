name: Build Urdu Story Video
on:
  workflow_dispatch:
    inputs:
      category:
        description: Story category
        required: true
        type: choice
        options: [auto, islamic, history, motivation]
        default: auto
      upload:
        description: Upload to YouTube (requires OAuth secret)
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "30 15 * * *"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      STORY_CATEGORY: ${{ github.event.inputs.category || 'auto' }}
      UPLOAD_TO_YOUTUBE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.upload == 'true' && 'true' || (github.event_name == 'schedule' && vars.UPLOAD_ON_SCHEDULE == 'true' && 'true' || 'false') }}
      YOUTUBE_PRIVACY: private
      URDU_VOICE: ur-PK-AsadNeural
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and Urdu fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Generate video
        run: python agent.py
      - name: Upload video files as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urdu-real-story-video
          path: output/
          if-no-files-found: warn
          retention-days: 7
